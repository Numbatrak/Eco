name: Numbatrak Cron

# Fires the numbatrak-dashboard daily-summary email job. 23:00 UTC = 00:00 WAT
# (West Africa Time is UTC+1, no DST), so this runs at midnight local time.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily summary emails
        env:
          API_BASE_URL: ${{ secrets.NUMBATRAK_API_BASE_URL || 'https://api-dev.numbatrak.com' }}
          CRON_SECRET: ${{ secrets.NUMBATRAK_CRON_SECRET }}
        run: |
          curl -sf -X POST "${API_BASE_URL}/numbatrak/cron/daily-summary" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
