name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/shared-types/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@platform/db --filter=@platform/shared-types

      - name: Build Lambda bundle
        run: node apps/api/build.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM deploy
        working-directory: apps/api
        env:
          P_BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          P_SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
          P_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          P_PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          P_STOREFRONT_APP_URL: ${{ secrets.STOREFRONT_APP_URL }}
          P_NUMBATRAK_APP_URL: ${{ secrets.NUMBATRAK_APP_URL }}
          P_BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          P_STOREFRONT_BASE_URL_TEMPLATE: ${{ secrets.STOREFRONT_BASE_URL_TEMPLATE }}
          P_META_APP_ID: ${{ secrets.META_APP_ID }}
          P_META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          sam deploy \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "StageName=prod" \
              "BetterAuthSecret=${P_BETTER_AUTH_SECRET:-changeme}" \
              "SecretEncryptionKey=${P_SECRET_ENCRYPTION_KEY:-changeme}" \
              "EmailFrom=${P_EMAIL_FROM:-noreply@example.com}" \
              "PublicAppUrl=${P_PUBLIC_APP_URL:-https://localhost:3002}" \
              "StorefrontAppUrl=${P_STOREFRONT_APP_URL:-https://localhost:3000}" \
              "NumbatrakAppUrl=${P_NUMBATRAK_APP_URL:-https://localhost:3003}" \
              "BetterAuthUrl=${P_BETTER_AUTH_URL:-https://localhost:3001}" \
              "StorefrontBaseUrlTemplate=${P_STOREFRONT_BASE_URL_TEMPLATE:-https://{subdomain}.localhost}" \
              "MetaAppId=${P_META_APP_ID:-none}" \
              "MetaAppSecret=${P_META_APP_SECRET:-none}"
