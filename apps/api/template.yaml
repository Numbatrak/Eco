AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Platform API - Fastify on Lambda with external Neon (Postgres) and Upstash (Redis)

Parameters:
  StageName:
    Type: String
    Default: prod
    AllowedValues: [prod, staging]

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Neon PostgreSQL connection string

  RedisUrl:
    Type: String
    NoEcho: true
    Description: Upstash Redis connection string

  BetterAuthSecret:
    Type: String
    NoEcho: true

  SecretEncryptionKey:
    Type: String
    NoEcho: true

  EmailFrom:
    Type: String
    Default: noreply@yourdomain.com

  PublicAppUrl:
    Type: String
    Description: Admin SPA origin (CORS)

  StorefrontAppUrl:
    Type: String
    Description: Storefront origin (CORS)

  NumbatrakAppUrl:
    Type: String
    Description: Numbatrak SPA origin (CORS)

  StorefrontBaseUrlTemplate:
    Type: String
    Default: "https://{subdomain}.yourdomain.com"

  BetterAuthUrl:
    Type: String
    Description: This API's public URL (Better Auth callback links)

  MetaAppId:
    Type: String
    Default: ""

  MetaAppSecret:
    Type: String
    NoEcho: true
    Default: ""

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - !Ref PublicAppUrl
          - !Ref StorefrontAppUrl
          - !Ref NumbatrakAppUrl
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - Cookie
        AllowCredentials: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub platform-api-${StageName}
      Handler: lambda.handler
      CodeUri: .build/
      Runtime: nodejs20.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          NODE_OPTIONS: "--enable-source-maps"
          DATABASE_URL: !Ref DatabaseUrl
          REDIS_URL: !Ref RedisUrl
          BETTER_AUTH_SECRET: !Ref BetterAuthSecret
          BETTER_AUTH_URL: !Ref BetterAuthUrl
          SECRET_ENCRYPTION_KEY: !Ref SecretEncryptionKey
          EMAIL_FROM: !Ref EmailFrom
          PUBLIC_APP_URL: !Ref PublicAppUrl
          STOREFRONT_APP_URL: !Ref StorefrontAppUrl
          NUMBATRAK_APP_URL: !Ref NumbatrakAppUrl
          STOREFRONT_BASE_URL_TEMPLATE: !Ref StorefrontBaseUrlTemplate
          META_APP_ID: !Ref MetaAppId
          META_APP_SECRET: !Ref MetaAppSecret
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
